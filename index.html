<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hundetraining</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="dog-profile">
            <h1>Mein Hund</h1>

            <form id="dog-profile-form">
                <label for="dog-name">Name</label>
                <input type="text" id="dog-name" name="dog-name" placeholder="Name des Hundes">

                <label for="dog-weight">Gewicht in kg</label>
                <input type="number" id="dog-weight" name="dog-weight" min="1" placeholder="z. B. 12">

                <label for="dog-breed">Rasse</label>
                <input type="text" id="dog-breed" name="dog-breed" placeholder="Rasse des Hundes">

                <label for="dog-age">Alter in Jahren</label>
                <input type="number" id="dog-age" name="dog-age" min="0" placeholder="z. B. 4">

                <button type="submit">Profil speichern</button>
            </form>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hundetraining</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="dog-profile">
            <h1>Mein Hund</h1>

            <form id="dog-profile-form">
                <label for="dog-name">Name</label>
                <input type="text" id="dog-name" name="dog-name" placeholder="Name des Hundes">

                <label for="dog-weight">Gewicht in kg</label>
                <input type="number" id="dog-weight" name="dog-weight" min="1" placeholder="z. B. 12">

                <label for="dog-breed">Rasse</label>
                <input type="text" id="dog-breed" name="dog-breed" placeholder="Rasse des Hundes">

                <label for="dog-age">Alter in Jahren</label>
                <input type="number" id="dog-age" name="dog-age" min="0" placeholder="z. B. 4">

                <button type="submit">Profil speichern</button>
            </form>
        </section>

        <section class="exercise-tracking">
            <h2>Tägliche Bewegung</h2>

            <form id="exercise-form">
                <label for="exercise-date">Datum</label>
                <input type="date" id="exercise-date" name="exercise-date">

                <label for="exercise-time">Bewegungszeit in Minuten</label>
                <input type="number" id="exercise-time" name="exercise-time" min="0" placeholder="z. B. 30">

                <button type="submit">Bewegung speichern</button>
            </form>

            <p>Heute: <strong id="today-exercise">0 Minuten</strong></p>
        </section>

        <section class="exercise-overview">
            <h2>Bewegung der letzten 30 Tage</h2>

            <figure>
                <figcaption>Tägliche Bewegungszeit in Minuten</figcaption>
                <div id="exercise-chart" role="img" aria-label="Balkengrafik mit der Bewegungszeit der letzten 30 Tage">
                    <p>Die Balkengrafik mit den gespeicherten Zeiten erscheint später hier.</p>
                </div>
            </figure>
        </section>
    </main>
</body>
</html>

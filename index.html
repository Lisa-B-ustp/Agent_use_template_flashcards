<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hundetraining</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="dog-profile">
            <h1>Mein Hund</h1>

            <form id="dog-profile-form">
                <label for="dog-name">Name</label>
                <input type="text" id="dog-name" name="dog-name" placeholder="Name des Hundes" required>

                <label for="dog-weight">Gewicht in kg</label>
                <input type="number" id="dog-weight" name="dog-weight" min="1" placeholder="z. B. 12" required>

                <label for="dog-breed">Rasse</label>
                <input type="text" id="dog-breed" name="dog-breed" placeholder="Rasse des Hundes" required>

                <label for="dog-age">Alter in Jahren</label>
                <input type="number" id="dog-age" name="dog-age" min="0" placeholder="z. B. 4" required>

                <button type="submit">Profil speichern</button>
            </form>

            <p id="dog-profile-summary" aria-live="polite">Noch kein Profil gespeichert.</p>
        </section>

        <section class="exercise-tracking">
            <h2>Tägliche Bewegung</h2>

            <form id="exercise-form">
                <label for="exercise-date">Datum</label>
                <input type="date" id="exercise-date" name="exercise-date" required>

                <label for="exercise-time">Bewegungszeit in Minuten</label>
                <input type="number" id="exercise-time" name="exercise-time" min="0" placeholder="z. B. 30" required>

                <button type="submit">Bewegung speichern</button>
            </form>

            <p id="exercise-save-message" aria-live="polite"></p>
            <p>Heute: <strong id="today-exercise">0 Minuten</strong></p>

            <h3>Gewicht erfassen</h3>
            <form id="weight-form">
                <label for="weight-date">Datum der Messung</label>
                <input type="date" id="weight-date" name="weight-date" required>

                <label for="weight-value">Gewicht in kg</label>
                <input type="number" id="weight-value" name="weight-value" min="0.1" step="0.1" placeholder="z. B. 12,5" required>

                <button type="submit">Gewicht speichern</button>
            </form>
            <p id="weight-save-message" aria-live="polite"></p>
        </section>

        <section class="exercise-overview">
            <h2>Bewegung der letzten 30 Tage</h2>

            <figure>
                <figcaption>Bewegungszeit in Minuten (Balken) und Gewicht in kg (Linie, eigene Skala)</figcaption>
                <ul class="chart-legend">
                    <li><span class="legend-exercise" aria-hidden="true"></span>Bewegungszeit</li>
                    <li><span class="legend-weight" aria-hidden="true"></span>Gewicht</li>
                </ul>
                <div id="exercise-chart" role="group" aria-label="Grafik mit Bewegungszeit als Balken und Gewicht als Linie für die letzten 30 Tage">
                    <p>Die Grafik mit Bewegungszeiten und Gewichtsmessungen erscheint hier.</p>
                </div>
            </figure>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>

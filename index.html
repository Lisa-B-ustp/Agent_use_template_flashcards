<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Vokabelpaar hinzufügen</h1>
    <form id="word-pair-form">
      <label for="english-word">English</label>
      <input id="english-word" name="english" type="text" required>

      <label for="german-word">Deutsch</label>
      <input id="german-word" name="german" type="text" required>

      <button type="submit">OK</button>
    </form>

    <section class="word-pair-list">
      <h2>Gespeicherte Vokabeln</h2>
      <ul id="word-pairs"></ul>
    </section>

    <section class="practice-mode">
      <h2>Übung</h2>
      <p id="practice-word">Keine Karte vorhanden.</p>
      <p id="practice-answer"></p>
      <button id="reveal-answer" type="button">Antwort zeigen</button>
      <button id="next-card" type="button">Nächste Karte</button>
      <button id="knew-it" type="button">Ich wusste es</button>
      <p id="knew-it-count">Gewusst: 0</p>
    </section>
  </main>
</body>
</html>
